# Egress allowlist proxy for sandbox containers. Only hosts in the filter file may be reached.
Port 3128
Listen 0.0.0.0
Timeout 600
MaxClients 200
Allow 0.0.0.0/0
DisableViaHeader Yes
ConnectPort 443
ConnectPort 80
Filter "/etc/tinyproxy/egress-allowlist.txt"
FilterURLs Off
FilterExtended On
FilterDefaultDeny Yes
LogLevel Info
