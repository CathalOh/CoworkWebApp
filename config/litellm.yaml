# LiteLLM proxy config for the fallback path (ILIAD exposes only an OpenAI-compatible surface, or we want
# cost tracking / virtual keys / retries in front of it). Model names here are what DeepAgentsRuntime requests.
model_list:
  - model_name: claude-opus-5
    litellm_params:
      model: anthropic/claude-opus-5
      api_base: os.environ/ILIAD_BASE_URL
      api_key: os.environ/ILIAD_AUTH_TOKEN
  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_base: os.environ/ILIAD_BASE_URL
      api_key: os.environ/ILIAD_AUTH_TOKEN
litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 600
general_settings:
  master_key: os.environ/LITELLM_API_KEY
