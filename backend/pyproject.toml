[project]
name = "cowork-backbone"
version = "0.1.0"
description = "Multi-user web Claude Desktop / Cowork backbone (FastAPI + Claude Agent SDK)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "arq>=0.26",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "cryptography>=42",
    "sse-starlette>=2.1",
    "structlog>=24",
    "croniter>=2.0",
    "pgvector>=0.3",
    "claude-agent-sdk>=0.2",
    "anthropic>=1.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "mypy>=1.10",
]
deepagents = ["deepagents>=0.3", "langchain-openai>=0.3", "langgraph>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
